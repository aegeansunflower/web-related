{% extends 'surveys/base.html' %}

{% block title %}{{ survey.title }} - AnCat{% endblock %}

{% block content %}
<!-- React & ReactDOM via CDN -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<!-- Babel for JSX -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<div id="survey-react-root"></div>

<script id="survey-data" type="application/json">
    {{ survey_data_json|safe }}
</script>

<script>
    const csrfToken = "{{ csrf_token }}";
    const surveyListUrl = "{% url 'survey_list' %}";
</script>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Parse the safely generated JSON payload from Django
    const surveyData = JSON.parse(document.getElementById('survey-data').textContent);

    /* {% verbatim %} */
    function SurveyApp() {
        const [currentStep, setCurrentStep] = useState(0);
        const [answers, setAnswers] = useState({});
        const [isAnimating, setIsAnimating] = useState(false);
        const formRef = useRef(null);

        const totalQuestions = surveyData.questions.length;
        const currentQuestion = surveyData.questions[currentStep];

        // Ensure answers is populated with arrays for checkboxes
        useEffect(() => {
            const initialAnswers = {};
            surveyData.questions.forEach(q => {
                if (q.type === 'checkbox') {
                    initialAnswers[q.id] = [];
                } else {
                    initialAnswers[q.id] = '';
                }
            });
            setAnswers(initialAnswers);
        }, []);

        const handleNext = () => {
            if (currentStep < totalQuestions - 1) {
                setIsAnimating(true);
                setTimeout(() => {
                    setCurrentStep(prev => prev + 1);
                    setIsAnimating(false);
                }, 300);
            } else {
                // Submit Form
                formRef.current.submit();
            }
        };

        const handlePrev = () => {
            if (currentStep > 0) {
                setIsAnimating(true);
                setTimeout(() => {
                    setCurrentStep(prev => prev - 1);
                    setIsAnimating(false);
                }, 300);
            }
        };

        const handleOptionSelect = (choiceId) => {
            if (currentQuestion.type === 'radio') {
                setAnswers(prev => ({ ...prev, [currentQuestion.id]: choiceId }));
                // Auto advance on radio select for Brilliant feel
                setTimeout(handleNext, 400);
            } else if (currentQuestion.type === 'checkbox') {
                setAnswers(prev => {
                    const selected = prev[currentQuestion.id] || [];
                    if (selected.includes(choiceId)) {
                        return { ...prev, [currentQuestion.id]: selected.filter(id => id !== choiceId) };
                    } else {
                        return { ...prev, [currentQuestion.id]: [...selected, choiceId] };
                    }
                });
            }
        };

        const handleTextChange = (e) => {
            setAnswers(prev => ({ ...prev, [currentQuestion.id]: e.target.value }));
        };

        const canProceed = () => {
            if (!currentQuestion) return false;
            if (!currentQuestion.required) return true;

            const ans = answers[currentQuestion.id];
            if (currentQuestion.type === 'checkbox') {
                return ans && ans.length > 0;
            }
            return ans && ans.toString().trim() !== '';
        };

        if (!currentQuestion) return null;

        const progressPercent = ((currentStep) / totalQuestions) * 100;

        return (
            <div style={{ maxWidth: '800px', margin: '0 auto', padding: '2rem 1rem' }}>
                <div style={{ marginBottom: '2rem', display: 'flex', alignItems: 'center', gap: '1rem' }}>
                    <a href={surveyListUrl} style={{ color: 'var(--text-muted)', textDecoration: 'none', display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
                        </svg>
                        Back
                    </a>
                    <div style={{ flex: 1, height: '6px', background: 'var(--border)', borderRadius: '3px', overflow: 'hidden' }}>
                        <div style={{ width: `${progressPercent}%`, height: '100%', background: 'var(--primary)', transition: 'width 0.5s ease-out' }}></div>
                    </div>
                    <span style={{ color: 'var(--text-muted)', fontSize: '0.9rem', fontWeight: 500 }}>{currentStep + 1} of {totalQuestions}</span>
                </div>

                <div style={{
                    opacity: isAnimating ? 0 : 1,
                    transform: isAnimating ? 'translateY(10px)' : 'translateY(0)',
                    transition: 'opacity 0.3s ease, transform 0.3s ease',
                    minHeight: '400px',
                    display: 'flex',
                    flexDirection: 'column'
                }}>
                    <h2 style={{ fontSize: '2rem', fontWeight: 500, marginBottom: '2rem', lineHeight: 1.3 }}>
                        {currentQuestion.text}
                        {currentQuestion.required && <span style={{ color: '#ea4335', marginLeft: '0.5rem' }}>*</span>}
                    </h2>

                    <div style={{ flex: 1 }}>
                        {currentQuestion.type === 'text' && (
                            <textarea
                                value={answers[currentQuestion.id] || ''}
                                onChange={handleTextChange}
                                placeholder="Type your answer here..."
                                style={{ width: '100%', padding: '1.5rem', fontSize: '1.2rem', borderRadius: '12px', border: '2px solid var(--border)', background: 'var(--bg-card)', color: 'var(--text-main)', outline: 'none', transition: 'border-color 0.2s', minHeight: '150px' }}
                                onFocus={(e) => e.target.style.borderColor = 'var(--primary)'}
                                onBlur={(e) => e.target.style.borderColor = 'var(--border)'}
                            />
                        )}

                        {(currentQuestion.type === 'radio' || currentQuestion.type === 'checkbox') && (
                            <div style={{ display: 'grid', gap: '1rem', gridTemplateColumns: '1fr' }}>
                                {currentQuestion.choices.map(choice => {
                                    const isSelected = currentQuestion.type === 'radio'
                                        ? answers[currentQuestion.id] === choice.id
                                        : (answers[currentQuestion.id] || []).includes(choice.id);

                                    return (
                                        <div
                                            key={choice.id}
                                            onClick={() => handleOptionSelect(choice.id)}
                                            style={{
                                                padding: '1.2rem 1.5rem',
                                                border: `2px solid ${isSelected ? 'var(--primary)' : 'var(--border)'}`,
                                                background: isSelected ? 'rgba(26, 115, 232, 0.05)' : 'var(--bg-card)',
                                                borderRadius: '12px',
                                                cursor: 'pointer',
                                                fontSize: '1.1rem',
                                                fontWeight: 500,
                                                display: 'flex',
                                                alignItems: 'center',
                                                gap: '1rem',
                                                transition: 'all 0.2s ease',
                                                transform: isSelected ? 'scale(1.01)' : 'scale(1)'
                                            }}
                                        >
                                            <div style={{
                                                width: '24px', height: '24px',
                                                borderRadius: currentQuestion.type === 'radio' ? '50%' : '6px',
                                                border: `2px solid ${isSelected ? 'var(--primary)' : 'var(--text-muted)'}`,
                                                display: 'flex', alignItems: 'center', justifyContent: 'center',
                                                background: isSelected ? 'var(--primary)' : 'transparent',
                                                transition: 'all 0.2s ease'
                                            }}>
                                                {isSelected && (
                                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                                                        <polyline points="20 6 9 17 4 12"></polyline>
                                                    </svg>
                                                )}
                                            </div>
                                            {choice.text}
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>

                    <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '3rem', borderTop: '1px solid var(--border)', paddingTop: '1.5rem' }}>
                        <button
                            onClick={handlePrev}
                            disabled={currentStep === 0}
                            style={{ padding: '0.8rem 2rem', fontSize: '1rem', background: 'transparent', color: currentStep === 0 ? 'var(--border)' : 'var(--text-main)', border: 'none', cursor: currentStep === 0 ? 'default' : 'pointer', fontWeight: 500, display: 'flex', alignItems: 'center', gap: '0.5rem' }}
                        >
                            Prev
                        </button>

                        <button
                            onClick={handleNext}
                            disabled={!canProceed()}
                            className="btn btn-primary"
                            style={{ padding: '0.8rem 2.5rem', fontSize: '1rem', opacity: !canProceed() ? 0.5 : 1, pointerEvents: !canProceed() ? 'none' : 'auto', display: 'flex', alignItems: 'center', gap: '0.5rem' }}
                        >
                            {currentStep === totalQuestions - 1 ? 'Submit' : 'Continue'}
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z" />
                            </svg>
                        </button>
                    </div>
                </div>

                {/* Hidden form to submit data to Django view natively */}
                <form ref={formRef} method="POST" action="." style={{ display: 'none' }}>
                    <input type="hidden" name="csrfmiddlewaretoken" value={csrfToken} />
                    {surveyData.questions.map(q => {
                        if (q.type === 'checkbox') {
                            const selected = answers[q.id] || [];
                            return selected.map(val => (
                                <input key={`${q.id}-${val}`} type="hidden" name={`question_${q.id}`} value={val} />
                            ));
                        }
                        return (
                            <input key={q.id} type="hidden" name={`question_${q.id}`} value={answers[q.id] || ''} />
                        );
                    })}
                </form>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('survey-react-root'));
    root.render(<SurveyApp />);
    /* {% endverbatim %} */
</script>
{% endblock %}
