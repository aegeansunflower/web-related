{% extends 'surveys/base.html' %}
{% block title %}Log In - AnCat{% endblock %}
{% block content %}
<style>
    .auth-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: calc(100vh - 200px);
        padding: 2rem 1rem;
    }

    .auth-card {
        width: 100%;
        max-width: 420px;
        background: var(--bg-card);
        padding: 2.5rem 2.5rem;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        border: 1px solid var(--border);
        animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        backdrop-filter: blur(10px);
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(30px) scale(0.98);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    .auth-card h2 {
        margin-bottom: 2rem;
        text-align: center;
        font-size: 2rem;
        font-weight: 600;
        color: var(--text-main);
        letter-spacing: -0.5px;
    }

    .auth-card form {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .auth-card p {
        margin-bottom: 1rem;
        display: flex;
        flex-direction: column;
        text-align: left;
    }

    .auth-card label {
        font-weight: 500;
        margin-bottom: 0.6rem;
        font-size: 0.95rem;
        color: var(--text-main);
    }

    .auth-card input[type="text"],
    .auth-card input[type="password"],
    .auth-card input[type="email"] {
        padding: 1rem 1.2rem;
        border: 2px solid var(--border);
        border-radius: 12px;
        background: var(--bg-main);
        color: var(--text-main);
        font-size: 1rem;
        outline: none;
        transition: all 0.2s ease;
        width: 100%;
    }

    .auth-card input[type="text"]:focus,
    .auth-card input[type="password"]:focus,
    .auth-card input[type="email"]:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(26, 115, 232, 0.1);
        transform: translateY(-1px);
    }

    .auth-card .helptext {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-top: 0.5rem;
        line-height: 1.4;
    }

    .auth-card ul.errorlist {
        color: #ea4335;
        font-size: 0.85rem;
        margin-top: 0.5rem;
        padding-left: 0;
        list-style: none;
    }

    .auth-card ul.errorlist li {
        margin-bottom: 0.2rem;
    }

    .auth-links {
        margin-top: 2rem;
        text-align: center;
        font-size: 0.95rem;
        color: var(--text-muted);
        padding-top: 1.5rem;
        border-top: 1px solid var(--border);
    }

    .auth-links a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s;
        margin-left: 0.5rem;
    }

    .auth-links a:hover {
        color: #1557b0;
        text-decoration: underline;
    }
</style>

<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary"
                style="width: 100%; margin-top: 1rem; padding: 1rem; font-size: 1.1rem; border-radius: 12px; font-weight: 600;">Log
                In</button>
        </form>
        <div class="auth-links">
            Don't have an account?<a href="{% url 'signup' %}">Sign Up</a>
        </div>
    </div>
</div>
{% endblock %}
