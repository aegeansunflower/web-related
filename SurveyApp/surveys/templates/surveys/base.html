<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AnCat{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'surveys/css/styles.css' %}">
    <script>
        // Check for saved user preference, if any, on load of the website
        const currentTheme = localStorage.getItem('theme') ? localStorage.getItem('theme') : null;
        if (currentTheme) {
            document.documentElement.className = currentTheme;
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            // Alternatively fallback to user's system preference
            document.documentElement.className = 'dark-theme';
        }
    </script>
</head>

<body>
    <nav class="navbar">
        <div class="container nav-content">
            <a href="{% url 'survey_list' %}" class="logo">An<span>Cat</span></a>
            <div class="nav-links" style="align-items: center;">
                <a href="{% url 'survey_list' %}">Anketleri Keşfet</a>
                {% if user.is_authenticated %}
                <a href="{% url 'survey_create' %}" class="btn btn-primary"
                    style="padding: 0.5rem 1rem; font-size: 0.9rem; font-weight: 500;">
                    Anket Oluştur
                </a>
                <div class="dropdown" style="position: relative; display: inline-block;">
                    <button class="btn btn-secondary dropdown-toggle"
                        style="display: flex; align-items: center; gap: 0.5rem; background: transparent; border: 1px solid var(--border-color); color: var(--text-color);">
                        <span
                            style="color: var(--primary); font-weight: bold; background: rgba(26,115,232,0.1); padding: 2px 8px; border-radius: 10px; font-size: 0.85rem; margin-right: 0.3rem;">
                            ⭐ {{ user.profile.points }}
                        </span>
                        {{ user.username }}
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 10l5 5 5-5z" />
                        </svg>
                    </button>
                    <div class="dropdown-content"
                        style="display: none; position: absolute; right: 0; background-color: var(--bg-card); min-width: 160px; box-shadow: var(--shadow-md); z-index: 100; border-radius: var(--radius); overflow: hidden; margin-top: 0.5rem; border: 1px solid var(--border-color);">
                        <a href="{% url 'profile' %}"
                            style="color: var(--text-color); padding: 12px 16px; text-decoration: none; display: block;">Profile</a>
                        <form action="{% url 'logout' %}" method="post" style="margin: 0; padding: 0;">
                            {% csrf_token %}
                            <button type="submit"
                                style="width: 100%; text-align: left; background: none; border: none; color: var(--error-color); padding: 12px 16px; font-family: inherit; font-size: inherit; cursor: pointer;">Log
                                Out</button>
                        </form>
                    </div>
                </div>
                {% else %}
                <a href="{% url 'login' %}" class="btn btn-secondary"
                    style="background: transparent; color: var(--text-color); border: 1px solid var(--border-color);">Log
                    In</a>
                <a href="{% url 'signup' %}" class="btn btn-primary">Sign Up</a>
                {% endif %}
                <button class="theme-toggle" id="theme-toggle" aria-label="Temayı Değiştir">
                    <svg id="theme-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z" />
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <main class="container main-content">
        {% block content %}{% endblock %}
    </main>

    <canvas id="antigravity-bg"
        style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none;"></canvas>

    <script>
        const toggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const rootElement = document.documentElement;

        // Path for moon (dark mode on, switch to light)
        const moonIcon = "M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z";
        // Path for sun (light mode on, switch to dark)
        const sunIcon = "M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0 8c-1.65 0-3-1.35-3-3s1.35-3 3-3 3 1.35 3 3-1.35 3-3 3zm0-13c.55 0 1 .45 1 1v2c0 .55-.45 1-1 1s-1-.45-1-1V3c0-.55.45-1 1-1zm0 18c.55 0 1 .45 1 1v2c0 .55-.45 1-1 1s-1-.45-1-1v-2c0-.55.45-1 1-1zm8-10h2c.55 0 1 .45 1 1s-.45 1-1 1h-2c-.55 0-1-.45-1-1s.45-1 1-1zm-18 0h2c.55 0 1 .45 1 1s-.45 1-1 1H2c-.55 0-1-.45-1-1s.45-1 1-1zm14.78-6.36c.39-.39 1.02-.39 1.41 0 .39.39.39 1.02 0 1.41l-1.41 1.41c-.39.39-1.02.39-1.41 0-.39-.39-.39-1.02 0-1.41l1.41-1.41zm-13.56 13.56c.39-.39 1.02-.39 1.41 0 .39.39.39 1.02 0 1.41l-1.41 1.41c-.39.39-1.02.39-1.41 0-.39-.39-.39-1.02 0-1.41l1.41-1.41zm14.97.01c.39.39.39 1.02 0 1.41-.39.39-1.02.39-1.41 0l-1.41-1.41c-.39-.39-.39-1.02 0-1.41.39-.39 1.02-.39 1.41 0l1.41 1.41zM6.64 5.22c.39.39.39 1.02 0 1.41-.39.39-1.02.39-1.41 0L3.82 5.22c-.39-.39-.39-1.02 0-1.41.39-.39 1.02-.39 1.41 0l1.41 1.41z";

        // Update icon based on current theme
        function updateIcon() {
            if (rootElement.classList.contains('dark-theme')) {
                themeIcon.querySelector('path').setAttribute('d', sunIcon);
            } else {
                themeIcon.querySelector('path').setAttribute('d', moonIcon);
            }
        }

        updateIcon();

        toggleBtn.addEventListener('click', function () {
            rootElement.classList.toggle('dark-theme');
            let theme = 'light';
            if (rootElement.classList.contains('dark-theme')) {
                theme = 'dark-theme';
            }
            localStorage.setItem('theme', theme);
            updateIcon();
        });

        // Dropdown toggle logic
        document.addEventListener('click', function (e) {
            const toggle = e.target.closest('.dropdown-toggle');
            const allDropdowns = document.querySelectorAll('.dropdown-content');

            if (toggle) {
                const dropdown = toggle.nextElementSibling;
                const isVisible = dropdown.style.display === 'block';
                allDropdowns.forEach(d => d.style.display = 'none');
                if (!isVisible) dropdown.style.display = 'block';
            } else {
                allDropdowns.forEach(d => d.style.display = 'none');
            }
        });

        // Antigravity background effect
        const canvas = document.getElementById('antigravity-bg');
        if (canvas) {
            const ctx = canvas.getContext('2d');
            let width, height;

            let particles = [];
            const mouse = { x: null, y: null, radius: 150 };

            window.addEventListener('mousemove', function (event) {
                mouse.x = event.x;
                mouse.y = event.y;
            });

            window.addEventListener('mouseout', function () {
                mouse.x = null;
                mouse.y = null;
            });

            function initCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                initParticles();
            }

            class Particle {
                constructor(x, y, dx, dy, size) {
                    this.x = x;
                    this.y = y;
                    this.dx = dx;
                    this.dy = dy;
                    this.size = size;
                    this.baseX = this.x;
                    this.baseY = this.y;
                    this.density = (Math.random() * 30) + 1;
                }

                draw() {
                    ctx.fillStyle = rootElement.classList.contains('dark-theme') ? 'rgba(255, 255, 255, 0.5)' : 'rgba(0, 0, 0, 0.2)';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.closePath();
                    ctx.fill();
                }

                update() {
                    // Mouse Repel Effect
                    if (mouse.x != null && mouse.y != null) {
                        let dx = mouse.x - this.x;
                        let dy = mouse.y - this.y;
                        let distance = Math.sqrt(dx * dx + dy * dy);
                        let forceDirectionX = dx / distance;
                        let forceDirectionY = dy / distance;
                        let maxDistance = mouse.radius;
                        let force = (maxDistance - distance) / maxDistance;
                        let directionX = forceDirectionX * force * this.density;
                        let directionY = forceDirectionY * force * this.density;

                        if (distance < mouse.radius) {
                            this.x -= directionX;
                            this.y -= directionY;
                        } else {
                            if (this.x !== this.baseX) {
                                let dx = this.x - this.baseX;
                                this.x -= dx / 10;
                            }
                            if (this.y !== this.baseY) {
                                let dy = this.y - this.baseY;
                                this.y -= dy / 10;
                            }
                        }
                    } else {
                        if (this.x !== this.baseX) {
                            let dx = this.x - this.baseX;
                            this.x -= dx / 10;
                        }
                        if (this.y !== this.baseY) {
                            let dy = this.y - this.baseY;
                            this.y -= dy / 10;
                        }
                    }
                    this.draw();
                }
            }

            function initParticles() {
                particles = [];
                // Reduce particles for better performance
                let numberOfParticles = (canvas.width * canvas.height) / 12000;
                for (let i = 0; i < numberOfParticles; i++) {
                    let size = (Math.random() * 2) + 1;
                    let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                    let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                    let dx = 0;
                    let dy = 0;
                    particles.push(new Particle(x, y, dx, dy, size));
                }
            }

            function animate() {
                requestAnimationFrame(animate);
                ctx.clearRect(0, 0, innerWidth, innerHeight);

                // Draw lines between particles
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    for (let j = i; j < particles.length; j++) {
                        let dx = particles[i].x - particles[j].x;
                        let dy = particles[i].y - particles[j].y;
                        let distance = Math.sqrt(dx * dx + dy * dy);
                        if (distance < 100) {
                            ctx.beginPath();
                            let opacity = 1 - (distance / 100);
                            ctx.strokeStyle = rootElement.classList.contains('dark-theme') ? `rgba(255,255,255,${opacity * 0.15})` : `rgba(0,0,0,${opacity * 0.1})`;
                            ctx.lineWidth = 1;
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }
            }

            window.addEventListener('resize', initCanvas);
            initCanvas();
            animate();
        }
    </script>
</body>

</html>
